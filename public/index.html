<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テニスコート監視設定</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Meiryo", "Segoe UI", sans-serif;
  background: #eef2f7;
  color: #2d3748;
  min-height: 100vh;
  padding-bottom: 48px;
}
header {
  background: linear-gradient(135deg, #2b6cb0, #3182ce);
  color: #fff;
  padding: 18px 20px 16px;
  margin-bottom: 24px;
}
header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .02em; }
header p  { font-size: .78rem; opacity: .75; margin-top: 3px; }

.container { max-width: 520px; margin: 0 auto; padding: 0 16px; }

.card {
  background: #fff;
  border-radius: 14px;
  padding: 18px 20px;
  margin-bottom: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,.07);
}
.card-title {
  font-size: .72rem;
  font-weight: 700;
  color: #a0aec0;
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 14px;
}

/* Group card */
.group-card { border: 1.5px solid #e2e8f0; }
.group-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.group-name {
  flex: 1;
  min-width: 0;
  padding: 8px 10px;
  border: 1.5px solid #e2e8f0;
  border-radius: 9px;
  font-size: 1rem;
  font-weight: 700;
  color: #2b6cb0;
  outline: none;
}
.group-name:focus { border-color: #4299e1; box-shadow: 0 0 0 3px #bee3f8; }
.group-del {
  flex-shrink: 0;
  padding: 7px 12px;
  background: #fff;
  color: #e53e3e;
  border: 1.5px solid #fed7d7;
  border-radius: 9px;
  font-size: .82rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.group-del:hover { background: #fff5f5; }
.sub-title {
  font-size: .74rem;
  font-weight: 700;
  color: #718096;
  margin: 14px 0 8px;
}
.sub-title:first-of-type { margin-top: 0; }

/* Add-group button */
.btn-add {
  width: 100%;
  padding: 12px;
  background: #fff;
  color: #3182ce;
  border: 1.5px dashed #90cdf4;
  border-radius: 12px;
  font-size: .92rem;
  font-weight: 700;
  cursor: pointer;
  transition: background .15s;
  margin-bottom: 20px;
}
.btn-add:hover { background: #ebf8ff; }

/* Chip checkboxes */
.chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border: 1.5px solid #e2e8f0;
  border-radius: 999px;
  cursor: pointer;
  font-size: .88rem;
  background: #fff;
  transition: all .15s;
  user-select: none;
  -webkit-user-select: none;
}
.chip input[type=checkbox] {
  width: 14px; height: 14px;
  accent-color: #3182ce;
  cursor: pointer;
  flex-shrink: 0;
}
.chip.on { background: #ebf4ff; border-color: #4299e1; color: #2b6cb0; font-weight: 600; }

/* Number fields */
.field-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 0;
  border-bottom: 1px solid #f7fafc;
}
.field-row:last-child { border-bottom: none; padding-bottom: 0; }
.field-row:first-child { padding-top: 0; }
.group-card .field-row { padding: 4px 0; border-bottom: none; }
.field-label { font-size: .9rem; color: #4a5568; flex: 1; }
.field-unit  { font-size: .82rem; color: #718096; white-space: nowrap; }
input[type=number] {
  width: 66px;
  padding: 7px 8px;
  border: 1.5px solid #e2e8f0;
  border-radius: 8px;
  font-size: .95rem;
  text-align: center;
  outline: none;
  transition: border .15s, box-shadow .15s;
  -moz-appearance: textfield;
}
input[type=number]::-webkit-inner-spin-button { opacity: 1; }
input[type=number]:focus {
  border-color: #4299e1;
  box-shadow: 0 0 0 3px #bee3f8;
}

/* Toggle */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid #f7fafc;
}
.toggle-row:last-child { border-bottom: none; padding-bottom: 0; }
.toggle-row:first-child { padding-top: 0; }
.toggle-info { flex: 1; min-width: 0; }
.toggle-name { font-size: .92rem; }
.toggle-note { font-size: .75rem; color: #a0aec0; margin-top: 3px; }
.sw { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
.sw input { opacity: 0; width: 0; height: 0; position: absolute; }
.sw-track {
  position: absolute; inset: 0;
  background: #cbd5e0;
  border-radius: 999px;
  cursor: pointer;
  transition: background .2s;
}
.sw-thumb {
  position: absolute;
  width: 20px; height: 20px;
  background: #fff;
  border-radius: 50%;
  top: 3px; left: 3px;
  transition: transform .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
  pointer-events: none;
}
.sw input:checked ~ .sw-track  { background: #4299e1; }
.sw input:checked ~ .sw-thumb  { transform: translateX(20px); }
.sw input:disabled ~ .sw-track { opacity: .45; cursor: default; }

/* Save button */
.btn-save {
  width: 100%;
  padding: 14px;
  background: #3182ce;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: background .15s, transform .1s;
  margin-top: 4px;
  letter-spacing: .03em;
}
.btn-save:hover  { background: #2b6cb0; }
.btn-save:active { transform: scale(.98); }
.btn-save:disabled { background: #a0aec0; cursor: default; }

/* Toast */
#toast {
  position: fixed;
  bottom: -60px;
  left: 50%;
  transform: translateX(-50%);
  padding: 11px 22px;
  background: #2d3748;
  color: #fff;
  border-radius: 9px;
  font-size: .88rem;
  box-shadow: 0 4px 18px rgba(0,0,0,.22);
  transition: bottom .28s ease;
  white-space: nowrap;
  z-index: 9999;
}
#toast.show { bottom: 28px; }

/* Password gate */
#gate {
  position: fixed; inset: 0;
  background: #eef2f7;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  z-index: 10000;
}
#gate .box {
  background: #fff;
  border-radius: 14px;
  padding: 26px 22px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 4px 20px rgba(0,0,0,.1);
}
#gate h2 { font-size: 1.05rem; margin-bottom: 6px; }
#gate p  { font-size: .8rem; color: #718096; margin-bottom: 16px; }
#gate input[type=password] {
  width: 100%;
  padding: 11px 12px;
  border: 1.5px solid #e2e8f0;
  border-radius: 9px;
  font-size: 1rem;
  outline: none;
  margin-bottom: 12px;
}
#gate input[type=password]:focus { border-color: #4299e1; box-shadow: 0 0 0 3px #bee3f8; }
#gate .err { color: #e53e3e; font-size: .8rem; min-height: 1.1em; margin-bottom: 10px; }
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- パスワード入力 -->
<div id="gate">
  <div class="box">
    <h2>🎾 設定を開く</h2>
    <p>このページの設定を見る／変更するにはパスワードが必要です。</p>
    <input type="password" id="gate-pw" placeholder="パスワード" autocomplete="current-password">
    <div class="err" id="gate-err"></div>
    <button class="btn-save" id="gate-btn">開く</button>
  </div>
</div>

<header>
  <h1>🎾 テニスコート監視設定</h1>
  <p>変更して「保存」を押すと GitHub の config.json に反映されます</p>
</header>

<div class="container">

  <!-- 監視グループ -->
  <div class="card-title" style="padding:0 4px 2px;">監視グループ（曜日 × 施設 × 時間帯）</div>
  <div id="groups-container">
    <div class="card"><span style="color:#a0aec0;font-size:.85rem">読み込み中…</span></div>
  </div>
  <button class="btn-add" id="add-group" type="button">＋ グループを追加</button>

  <!-- 頻度・監視期間 -->
  <div class="card">
    <div class="card-title">頻度・監視期間</div>
    <div class="field-row">
      <span class="field-label">チェック間隔</span>
      <input type="number" id="interval" min="0" max="24" value="2">
      <span class="field-unit">時間ごと</span>
    </div>
    <div class="field-row">
      <span class="field-label">監視期間</span>
      <input type="number" id="look-ahead" min="1" max="180" value="60">
      <span class="field-unit">日間先まで</span>
    </div>
  </div>

  <!-- 通知方法 -->
  <div class="card">
    <div class="card-title">通知方法</div>
    <div class="toggle-row">
      <div class="toggle-info">
        <div class="toggle-name">メール通知</div>
        <div class="toggle-note" id="email-addr">-</div>
      </div>
      <label class="sw">
        <input type="checkbox" id="email-toggle">
        <div class="sw-track"></div>
        <div class="sw-thumb"></div>
      </label>
    </div>
    <div class="toggle-row">
      <div class="toggle-info">
        <div class="toggle-name">LINE 通知</div>
        <div class="toggle-note">Secrets に LINE_CHANNEL_TOKEN / LINE_USER_ID が必要</div>
      </div>
      <label class="sw">
        <input type="checkbox" id="line-toggle">
        <div class="sw-track"></div>
        <div class="sw-thumb"></div>
      </label>
    </div>
  </div>

  <button class="btn-save" id="save-btn" onclick="saveConfig()">設定を保存</button>

</div>
<div id="toast"></div>

<script>
let cfg = {};
let masterFacilities = [];  // [{display, system, enabled}] — 施設マスター（config.cities から）
const PW_KEY = "tennis_settings_pw";

// 曜日キー（config）と表示ラベルの対応
const DAY_DEFS = [
  ["monday", "月"], ["tuesday", "火"], ["wednesday", "水"], ["thursday", "木"],
  ["friday", "金"], ["saturday", "土"], ["sunday", "日"], ["holiday", "祝"],
];

function pw() { return sessionStorage.getItem(PW_KEY) || ""; }

function authHeaders(extra) {
  return Object.assign({ "x-settings-password": pw() }, extra || {});
}

function setChip(lbl, on) { lbl.classList.toggle('on', on); }

function subTitle(t) {
  const d = document.createElement('div');
  d.className = 'sub-title';
  d.textContent = t;
  return d;
}

// ── パスワードゲート ──
const gate    = document.getElementById('gate');
const gateBtn = document.getElementById('gate-btn');
const gatePw  = document.getElementById('gate-pw');
const gateErr = document.getElementById('gate-err');

async function tryUnlock() {
  gateErr.textContent = '';
  const val = gatePw.value;
  if (!val) { gateErr.textContent = 'パスワードを入力してください'; return; }
  sessionStorage.setItem(PW_KEY, val);
  const ok = await loadConfig();
  if (ok) {
    gate.classList.add('hidden');
  } else {
    sessionStorage.removeItem(PW_KEY);
  }
}
gateBtn.addEventListener('click', tryUnlock);
gatePw.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

async function loadConfig() {
  let res;
  try {
    res = await fetch('/api/config', { headers: authHeaders() });
  } catch {
    gateErr.textContent = 'サーバーに接続できません';
    return false;
  }
  if (res.status === 401) { gateErr.textContent = 'パスワードが違います'; return false; }
  if (!res.ok) {
    let msg = '読み込みに失敗しました';
    try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
    gateErr.textContent = msg;
    return false;
  }
  try {
    cfg = await res.json();
  } catch {
    gateErr.textContent = '設定の解析に失敗しました';
    return false;
  }
  render();
  return true;
}

// ── グループカードの生成 ──
function buildGroupCard(g) {
  const card = document.createElement('div');
  card.className = 'card group-card';

  // ヘッダ: 名前 + 削除
  const head = document.createElement('div');
  head.className = 'group-head';
  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.className = 'group-name';
  nameInput.placeholder = 'グループ名（例: 土日祝）';
  nameInput.value = g.name || '';
  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'group-del';
  del.textContent = '削除';
  del.onclick = () => card.remove();
  head.appendChild(nameInput);
  head.appendChild(del);
  card.appendChild(head);

  // 対象曜日
  card.appendChild(subTitle('対象曜日'));
  const dayGroup = document.createElement('div');
  dayGroup.className = 'chip-group';
  const gdays = new Set(g.target_days || []);
  DAY_DEFS.forEach(([key, label]) => {
    const lbl = document.createElement('label');
    const on  = gdays.has(key);
    lbl.className = 'chip' + (on ? ' on' : '');
    const cb  = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = on;
    cb.dataset.day = key;
    cb.addEventListener('change', () => setChip(lbl, cb.checked));
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(' ' + label));
    dayGroup.appendChild(lbl);
  });
  card.appendChild(dayGroup);

  // 対象施設
  card.appendChild(subTitle('対象施設'));
  const facGroup = document.createElement('div');
  facGroup.className = 'chip-group';
  // グループに facilities 指定が無ければ全施設をオンとみなす
  const gfacs = new Set(g.facilities || masterFacilities.map(f => f.display));
  if (!masterFacilities.length) {
    facGroup.innerHTML = '<span style="color:#a0aec0;font-size:.85rem">施設が設定されていません</span>';
  } else {
    masterFacilities.forEach(f => {
      const lbl = document.createElement('label');
      const on  = gfacs.has(f.display);
      lbl.className = 'chip' + (on ? ' on' : '');
      const cb  = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = on;
      cb.dataset.fac = f.display;
      cb.addEventListener('change', () => setChip(lbl, cb.checked));
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(' ' + f.display));
      facGroup.appendChild(lbl);
    });
  }
  card.appendChild(facGroup);

  // 時間帯
  card.appendChild(subTitle('時間帯（開始時刻の範囲）'));
  const row = document.createElement('div');
  row.className = 'field-row';
  const startV = g.slot_start_hour ?? 8;
  const endV   = g.slot_end_hour ?? 11;
  row.innerHTML =
    '<span class="field-label">通知する枠</span>' +
    '<input type="number" class="g-start" min="0" max="23" value="' + startV + '">' +
    '<span class="field-unit">時 〜</span>' +
    '<input type="number" class="g-end" min="1" max="24" value="' + endV + '">' +
    '<span class="field-unit">時開始</span>';
  card.appendChild(row);

  return card;
}

function render() {
  // --- 施設マスター ---
  const city = (cfg.cities || [{}])[0] || {};
  masterFacilities = Array.isArray(city.facilities)
    ? city.facilities.filter(f => f.enabled !== false)
    : [];

  // --- グループ ---
  const sched = cfg.schedule || {};
  let groups = Array.isArray(sched.groups) ? sched.groups : [];
  if (!groups.length) {
    // 旧形式（単一の target_days / slot_*）からの移行、または空設定
    groups = [{
      name: '既定',
      target_days: sched.target_days || ['saturday', 'sunday', 'holiday'],
      facilities: masterFacilities.map(f => f.display),
      slot_start_hour: sched.slot_start_hour ?? 8,
      slot_end_hour: sched.slot_end_hour ?? 11,
    }];
  }
  const container = document.getElementById('groups-container');
  container.innerHTML = '';
  groups.forEach(g => container.appendChild(buildGroupCard(g)));

  // --- 頻度・監視期間 ---
  document.getElementById('interval').value   = sched.check_interval_hours ?? 2;
  document.getElementById('look-ahead').value = sched.look_ahead_days ?? 60;

  // --- 通知 ---
  const n = cfg.notifications || {};
  document.getElementById('email-addr').textContent = n.email || '未設定';
  // email_enabled が無い既存設定は「オン」とみなす（従来はメール常時オンのため）
  document.getElementById('email-toggle').checked = n.email_enabled !== false;
  document.getElementById('line-toggle').checked  = !!n.line;
}

// 追加ボタン
document.getElementById('add-group').addEventListener('click', () => {
  const card = buildGroupCard({
    name: '',
    target_days: [],
    facilities: masterFacilities.map(f => f.display),
    slot_start_hour: 8,
    slot_end_hour: 11,
  });
  document.getElementById('groups-container').appendChild(card);
});

function collectGroups() {
  const cards = document.querySelectorAll('#groups-container .group-card');
  const groups = [];
  cards.forEach(card => {
    const name = card.querySelector('.group-name').value.trim();
    const target_days = Array.from(card.querySelectorAll('[data-day]:checked'))
      .map(cb => cb.dataset.day);
    const facilities = Array.from(card.querySelectorAll('[data-fac]:checked'))
      .map(cb => cb.dataset.fac);
    const startH = parseInt(card.querySelector('.g-start').value, 10);
    const endH   = parseInt(card.querySelector('.g-end').value, 10);
    groups.push({ name, target_days, facilities, slot_start_hour: startH, slot_end_hour: endH });
  });
  return groups;
}

function saveConfig() {
  const btn = document.getElementById('save-btn');

  const groups = collectGroups();
  if (!groups.length) { showToast('グループを1つ以上作成してください'); return; }
  for (const g of groups) {
    const label = g.name || '(名称未設定)';
    if (isNaN(g.slot_start_hour) || isNaN(g.slot_end_hour) || g.slot_start_hour >= g.slot_end_hour) {
      showToast('「' + label + '」の開始時刻は終了時刻より前にしてください');
      return;
    }
    if (!g.target_days.length) { showToast('「' + label + '」の曜日を選択してください'); return; }
    if (!g.facilities.length)  { showToast('「' + label + '」の施設を選択してください'); return; }
  }

  const interval  = parseInt(document.getElementById('interval').value, 10);
  const lookAhead = parseInt(document.getElementById('look-ahead').value, 10);

  const newSchedule = {
    ...(cfg.schedule || {}),
    groups,
    check_interval_hours: isNaN(interval) ? 0 : interval,
    look_ahead_days: isNaN(lookAhead) ? 60 : lookAhead,
  };
  // 旧形式のキーが残っていると混乱するため削除（groups が唯一の設定源）
  delete newSchedule.target_days;
  delete newSchedule.slot_start_hour;
  delete newSchedule.slot_end_hour;

  const newCfg = {
    ...cfg,
    // cities（施設マスター）はこの画面では変更しないのでそのまま保持
    schedule: newSchedule,
    notifications: {
      ...(cfg.notifications || {}),
      email_enabled: document.getElementById('email-toggle').checked,
      line:          document.getElementById('line-toggle').checked,
    },
  };

  btn.disabled = true;
  btn.textContent = '保存中…';
  fetch('/api/config', {
    method:  'POST',
    headers: authHeaders({ 'Content-Type': 'application/json' }),
    body:    JSON.stringify(newCfg),
  })
  .then(async r => {
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) { cfg = newCfg; showToast('設定を保存しました ✓'); }
    else if (r.status === 401) { showToast('パスワードが違います'); }
    else { showToast('エラー: ' + (j.error || ('HTTP ' + r.status))); }
  })
  .catch(() => showToast('サーバーへの接続に失敗しました'))
  .finally(() => { btn.disabled = false; btn.textContent = '設定を保存'; });
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// セッションに既にパスワードがあれば自動で開く
if (pw()) {
  loadConfig().then(ok => { if (ok) gate.classList.add('hidden'); });
}
gatePw.focus();
</script>
</body>
</html>
